name: VCPulse Family A-B-C Backtest

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "回測起始日期 YYYY-MM-DD"
        required: true
        default: "2026-08-14"
      end_date:
        description: "回測結束日期 YYYY-MM-DD"
        required: true
        default: "2026-09-10"

jobs:
  family-abc:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        mode: [current, max, decay]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy requests
      - name: Run family mode
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          python tools/vcpulse_theme_historical_runner_v0_3_family_abc.py             --theme-db data/vcpulse_themes_v2_9_research_alpha127.json             --start "${{ inputs.start_date }}"             --end "${{ inputs.end_date }}"             --cache-dir "backtest_cache_${{ matrix.mode }}"             --out-dir "backtest_output_${{ matrix.mode }}"             --family-mode "${{ matrix.mode }}"
      - uses: actions/upload-artifact@v4
        with:
          name: vcpulse-family-abc-${{ matrix.mode }}
          path: backtest_output_${{ matrix.mode }}/
