name: VCPulse V2.9 Alpha24 Timing Guardrail

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Historical start date"
        required: true
        default: "2026-07-01"
      end_date:
        description: "Historical end date"
        required: true
        default: "2026-09-11"
      max_days:
        description: "Historical trading days"
        required: true
        default: "40"

permissions:
  contents: read

jobs:
  alpha24-timing-guardrail:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pandas numpy requests
      - name: Run historical engine
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          python tools/vcpulse_theme_historical_runner_v0_9_1_retry.py             --theme-db data/vcpulse_themes_v2_9_research_alpha24.json             --start "${{ inputs.start_date }}"             --end "${{ inputs.end_date }}"             --max-days "${{ inputs.max_days }}"             --cache-dir backtest_cache_alpha24             --out-dir backtest_output_alpha24
      - name: Rebuild Alpha23 event sample
        run: |
          python tools/vcpulse_theme_entry_event_study_v0_1.py             --daily backtest_output_alpha24/backtest_daily.json             --cache-dir backtest_cache_alpha24             --out-dir alpha23_rebuild_alpha24
      - name: Run Alpha24 timing guardrail research
        run: |
          python tools/vcpulse_timing_guardrail_research_v0_1.py             --event-json alpha23_rebuild_alpha24/alpha23_event_study.json             --out-dir alpha24_output
      - name: Upload Alpha24 results
        uses: actions/upload-artifact@v4
        with:
          name: vcpulse-alpha24-validation
          path: |
            alpha24_output/
            alpha23_rebuild_alpha24/
            backtest_output_alpha24/
          retention-days: 30
